# Alloy: rede interna, destino próprio, filas e recursos limitados.
services:
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.5
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - --disable-reporting
    environment:
      OPENOBSERVE_OTLP_ENDPOINT: http://observabilidade-openobserve:5080/api/default
      OPENOBSERVE_USERNAME: ${OPENOBSERVE_USERNAME}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD}
      GOMEMLIMIT: 800MiB
    # privileged + mounts do host: exigidos pelo cadvisor embutido para ler
    # cgroups por container (sem eles só o cgroup raiz "/" é reportado).
    privileged: true
    volumes:
      - alloy-data:/var/lib/alloy
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # cadvisor resolve metadados via containerd (Docker+overlayfs).
      # Montar o DIRETÓRIO, não o arquivo do socket: bind mount de arquivo prende
      # o inode e, quando o containerd reinicia (novo socket no mesmo path), o
      # container segue no inode morto e o dial falha com "connection refused" —
      # o cAdvisor para de criar os containers ("Failed to create existing
      # container") e as métricas de container somem do Grafana Cloud.
      - /run/containerd:/run/containerd:ro
    networks:
      - dokploy-network

  faro-gateway:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.1
    volumes:
      - ./alloy/faro-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true

volumes:
  alloy-data:
