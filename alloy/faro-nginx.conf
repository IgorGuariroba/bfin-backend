events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=browser:1m rate=2r/s;
  map $http_origin $allowed_origin { default 0; "https://bfincont.com.br" 1; }
  server {
    listen 8080;
    client_max_body_size 64k;
    location = /collect {
      if ($allowed_origin = 0) { return 403; }
      limit_except POST OPTIONS { deny all; }
      limit_req zone=browser burst=5 nodelay;
      resolver 127.0.0.11 valid=10s;
      set $receiver http://alloy:12347;
      proxy_pass $receiver;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }
    location = /healthz { return 200 'ok'; }
    location / { return 404; }
  }
}
